name: CI

on:
  push:
    branches:
      - feature/android-mvp
  pull_request:
    branches:
      - main

jobs:
  flutter-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Flutter tests
        run: flutter test
