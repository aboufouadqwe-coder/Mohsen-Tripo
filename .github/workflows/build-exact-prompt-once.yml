name: Verify and release media-3d fix APK

on:
  push:
    branches:
      - feature/android-mvp
    paths:
      - .github/workflows/build-exact-prompt-once.yml
      - app/**
      - supabase/functions/**

permissions:
  contents: write

jobs:
  verify-build-release:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://zzsjejluvufjtaxsqjme.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_nL_A-yNI-RIJMEHkna3cdg_DZ6pBAUq
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Edge Function contract tests
        working-directory: supabase
        run: deno task test

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze Flutter
        working-directory: app
        run: flutter analyze

      - name: Test Flutter
        working-directory: app
        run: flutter test

      - name: Build release APK
        working-directory: app
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mohsen-tripo-media-3d-fix
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-mvp-media-3d-${GITHUB_SHA::7}"
          cp app/build/app/outputs/flutter-apk/app-release.apk /tmp/Mohsen-Tripo-media-3d-fix.apk
          gh release create "$TAG" /tmp/Mohsen-Tripo-media-3d-fix.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Mohsen-Tripo Media + 3D Fix" \
            --notes "Adds explicit generated-image download to Android gallery, resumes interrupted 3D polling after returning to the workspace, and hardens Tripo GLB persistence."
