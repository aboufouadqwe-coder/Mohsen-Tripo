name: Verify and release smart part planner APK

on:
  push:
    branches:
      - feature/android-mvp
    paths:
      - .github/workflows/build-exact-prompt-once.yml
      - app/**
      - supabase/functions/**

permissions:
  contents: write

concurrency:
  group: android-mvp-smart-parts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build-release:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://zzsjejluvufjtaxsqjme.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_nL_A-yNI-RIJMEHkna3cdg_DZ6pBAUq
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Edge Function contract tests
        working-directory: supabase
        run: deno task test

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze Flutter
        working-directory: app
        run: flutter analyze

      - name: Test Flutter
        working-directory: app
        run: flutter test

      - name: Build release APK
        working-directory: app
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mohsen-tripo-smart-part-planner
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-mvp-smart-parts-${GITHUB_SHA::7}"
          cp app/build/app/outputs/flutter-apk/app-release.apk /tmp/Mohsen-Tripo-smart-part-planner.apk
          gh release create "$TAG" /tmp/Mohsen-Tripo-smart-part-planner.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Mohsen-Tripo Smart Part Planner" \
            --notes "Adds on-device face/pose analysis, Smart Part Planner suggestions, MetaHuman-ready smart prompt profiles, Exact/Smart prompt modes, manual rectangular part-region selection and per-part cropped references. Preserves sequential multi-part generation, timers, credits, 3D mesh controls, viewer, and download fixes."
