name: Build exact-prompt APK once

on:
  push:
    branches:
      - feature/android-mvp
    paths:
      - .github/workflows/build-exact-prompt-once.yml

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://zzsjejluvufjtaxsqjme.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_nL_A-yNI-RIJMEHkna3cdg_DZ6pBAUq
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: mohsen-tripo-exact-prompt-fix
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 3
