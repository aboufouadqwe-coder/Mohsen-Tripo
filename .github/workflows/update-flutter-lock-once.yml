name: Update Flutter Lock Once

on:
  push:
    branches:
      - feature/android-mvp
    paths:
      - ".github/update-flutter-lock-request"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Resolve pinned dependencies
        working-directory: app
        run: flutter pub get
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/pubspec.lock
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "chore: update Flutter dependency lockfile"
          git push origin HEAD:feature/android-mvp
