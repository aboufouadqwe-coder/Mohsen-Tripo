name: Smart UV Build Status

on:
  push:
    branches:
      - feature/android-mvp
    paths:
      - .github/workflows/smart-uv-build-status.yml
      - app/**
      - supabase/functions/**

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://zzsjejluvufjtaxsqjme.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_nL_A-yNI-RIJMEHkna3cdg_DZ6pBAUq

    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/android-mvp

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - id: deno_test
        name: Deno tests
        continue-on-error: true
        working-directory: supabase
        run: deno task test

      - id: deno_fmt
        name: Deno format
        continue-on-error: true
        working-directory: supabase
        run: deno fmt --check functions

      - id: deno_lint
        name: Deno lint
        continue-on-error: true
        working-directory: supabase
        run: deno lint functions

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - id: flutter_pub
        name: Flutter dependencies
        continue-on-error: true
        working-directory: app
        run: flutter pub get

      - id: flutter_analyze
        name: Flutter analyze
        continue-on-error: true
        working-directory: app
        run: flutter analyze

      - id: flutter_test
        name: Flutter tests
        continue-on-error: true
        working-directory: app
        run: flutter test

      - id: flutter_build
        name: Flutter build
        continue-on-error: true
        working-directory: app
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Record diagnostic outcomes
        if: always()
        run: |
          mkdir -p .ci
          cat > .ci/smart-uv-build-status.json <<EOF
          {
            "commit": "$GITHUB_SHA",
            "deno_test": "${{ steps.deno_test.outcome }}",
            "deno_fmt": "${{ steps.deno_fmt.outcome }}",
            "deno_lint": "${{ steps.deno_lint.outcome }}",
            "flutter_pub": "${{ steps.flutter_pub.outcome }}",
            "flutter_analyze": "${{ steps.flutter_analyze.outcome }}",
            "flutter_test": "${{ steps.flutter_test.outcome }}",
            "flutter_build": "${{ steps.flutter_build.outcome }}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/smart-uv-build-status.json
          git commit -m "ci: record Smart UV diagnostic outcomes" || true
          git push origin HEAD:feature/android-mvp
