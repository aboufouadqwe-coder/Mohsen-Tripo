name: Bootstrap Supabase Scaffold

on:
  push:
    branches:
      - feature/android-mvp
    paths:
      - .github/bootstrap-supabase-request

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Generate Supabase local scaffold
        shell: bash
        run: |
          set -euo pipefail
          test ! -d supabase
          supabase init
          supabase migration new initial_schema

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase
          git diff --cached --check
          git commit -m "chore: add Supabase CLI scaffold"
          git push origin HEAD:feature/android-mvp
