name: Bootstrap Android Scaffold

on:
  push:
    branches:
      - feature/android-mvp
    paths:
      - .github/bootstrap-android-request

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Generate Android scaffold with Flutter
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          flutter create             --platforms=android             --org com.mohsentripo             --project-name mohsen_tripo             "$tmp/generated"

          rm -rf app/android
          cp -R "$tmp/generated/android" app/android
          cp "$tmp/generated/.metadata" app/.metadata

          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path("app/android/app/build.gradle.kts"),
              Path("app/android/app/build.gradle"),
          ]
          changed = False
          for path in candidates:
              if not path.exists():
                  continue
              text = path.read_text()
              replacements = [
                  ("minSdk = flutter.minSdkVersion", "minSdk = 24"),
                  ("minSdkVersion flutter.minSdkVersion", "minSdkVersion 24"),
              ]
              for old, new in replacements:
                  if old in text:
                      text = text.replace(old, new)
                      changed = True
              path.write_text(text)

          if not changed:
              raise SystemExit("Could not enforce Android minSdk 24")
          PY

          (
            cd app
            flutter pub get
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/android app/.metadata app/pubspec.lock
          git diff --cached --check
          git commit -m "chore: add Flutter-generated Android scaffold"
          git push origin HEAD:feature/android-mvp
