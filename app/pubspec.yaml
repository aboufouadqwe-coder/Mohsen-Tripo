name: mohsen_tripo
description: Android-first AI asset generation app using Tripo v3.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: 2.17.2
  flutter_riverpod: 3.4.3
  go_router: 18.0.1
  image_picker: 1.2.3
  model_viewer_plus: 1.10.0
  path_provider: 2.1.6
  posthog_flutter: 5.43.1
  uuid: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  mocktail: 1.0.5

flutter:
  uses-material-design: true
